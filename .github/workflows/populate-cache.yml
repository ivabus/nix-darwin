name: Populate binary cache with pre-built secretless systems

on:
  push:
    branches:
      - master
  workflow_dispatch:
  schedule:
  - cron: '0 3 * * *' # nightly (literally) prepopulating cache to use during day
    timezone: "Europe/Moscow"

permissions:
  contents: write

jobs:
  build:
    name: Build and cache
    runs-on: macos-26
    environment: Actions
    env:
      ATTIC_CACHE: darwin
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/determinate-nix-action@v3
      - name: Configure Attic cache
        env:
          ATTIC_SERVER: ${{ secrets.ATTIC_SERVER }}
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          : "${ATTIC_SERVER:?ATTIC_SERVER secret is required}"
          : "${ATTIC_TOKEN:?ATTIC_TOKEN secret is required}"
          nix profile add nixpkgs#attic-client
          attic login github-actions "$ATTIC_SERVER" "$ATTIC_TOKEN"
          attic use "$ATTIC_CACHE"
          attic use rustversebot
      - name: Update flake.lock # not pushing, recursion otherwise
        run: nix flake update
      - parallel:
          - name: Build celerrime-x
            run: |
              nix --extra-experimental-features pipe-operators build 'path:.#darwinConfigurations.celerrime-x.system' --out-link celerrime-x
          - name: Build effundam-x
            run: |
              nix --extra-experimental-features pipe-operators build 'path:.#darwinConfigurations.effundam-x.system' --out-link effundam-x
      - name: Push to binary cache
        run: attic push --ignore-upstream-cache-filter -j2 "$ATTIC_CACHE" ./effundam-x ./celerrime-x
      - name: Upload artifact to GitHub
        uses: actions/upload-artifact@v7
        with:
          name: flake.lock
          path: flake.lock